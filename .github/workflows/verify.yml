name: Verify toolkit
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: toolkit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run example:build
      - run: npm run watch:check
      - run: npx playwright install --with-deps chromium
      - run: npm run nested:test
      - run: npm run example:test
      - run: npm run pack:check -- --browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: toolkit-browser-reports
          path: |
            examples/toolkit-consumer/test-results
            examples/toolkit-consumer/playwright-report
  maplibre-6:
    # The default install pins MapLibre 5; consumers on MapLibre 6 build the
    # same source, so typecheck, test and build it against that major too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --ignore-scripts maplibre-gl@^6.0.0
      - run: npm run check
      - run: npm test
      - run: npm run build
